<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You, Mom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lora:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            background-color: #fcf9f9; /* Soft, warm backup color */
        }

        /* The Background Wrapper */
        .hero-section {
            /* Make sure your picture is named background.jpg */
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* A soft gradient overlay to ensure text is always readable without a harsh box */
            box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.35);
            padding: 20px;
        }

        /* The Message Container */
        .message-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 50px 40px;
            max-width: 550px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            color: #2c2c2c;
            font-size: 2.2rem;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        p.quote {
            font-family: 'Lora', serif;
            font-size: 1.15rem;
            color: #4a4a4a;
            line-height: 1.8;
            margin-bottom: 30px;
            font-style: italic;
        }

        p.message {
            font-family: 'Lora', serif;
            font-size: 1.05rem;
            color: #333;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .signature {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: #2c2c2c;
            font-style: italic;
            margin-top: 10px;
        }

        /* Small decorative line */
        .divider {
            width: 50px;
            height: 1px;
            background-color: #b59898;
            margin: 0 auto 25px auto;
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .message-container {
                padding: 40px 25px;
            }
            h1 {
                font-size: 1.8rem;
            }
            p.quote {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="message-container">
            <h1>To My Beautiful Mom</h1>
            <div class="divider"></div>
            <p class="quote">"A mother and daughter share a bond that grows more beautiful with every passing day."</p>
            <p class="message">For every hug, every little lesson, and the endless love you pour into my life—thank you. You are my guiding light, my comfort, and my favorite smile.</p>
            <p class="signature">With all my love,<br>Haadhya</p>
        </div>
    </div>

</body>
</html>
