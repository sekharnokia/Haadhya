<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <style>
        /* Reset margins and paddings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Full-screen background image setup */
        .bg-image {
            /* Ensure your image is named background.jpg and is in the same folder */
            background-image: url('background.jpg');
            
            /* Center and scale the image nicely */
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            
            /* Full height */
            height: 100%;
            
            /* Flexbox to perfectly center the content card */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The frosted-glass content card */
        .content-card {
            background-color: rgba(255, 255, 255, 0.85); /* White with 85% opacity */
            padding: 40px 60px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px); /* Creates the frosted glass effect */
            max-width: 600px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 2.5em;
        }

        p {
            color: #555;
            line-height: 1.6;
            font-size: 1.1em;
            margin-bottom: 25px;
        }

        .social-links a {
            display: inline-block;
            margin: 0 10px;
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .social-links a:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <div class="bg-image">
        <div class="content-card">
            <h1>Welcome</h1>
            <p>I'm a Linux Systems Administrator and web developer. Welcome to my personal portfolio. Stay tuned for more updates and projects.</p>
            <div class="social-links">
                <a href="#">LinkedIn</a>
                <a href="#">GitHub</a>
            </div>
        </div>
    </div>

</body>
</html>
