<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You, Mom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,600&family=Lora:ital@1&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            background-color: #000; /* Fallback background */
        }

        /* The Background Wrapper */
        .hero-section {
            /* Adds a very subtle dark tint over your image so the white text stands out beautifully */
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.4)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* The Message Container - Removed the white box completely */
        .message-container {
            padding: 20px;
            max-width: 650px;
            text-align: center;
        }

        /* All text is now white, italicized, with a deep drop shadow for legibility */
        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            color: #ffffff;
            font-size: 2.8rem;
            margin-bottom: 20px;
            letter-spacing: 1.5px;
            font-style: italic;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }

        p.quote, p.message, .signature {
            font-family: 'Lora', serif;
            color: #fdfdfd;
            font-style: italic;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
        }

        p.quote {
            font-size: 1.3rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        p.message {
            font-size: 1.15rem;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .signature {
            font-size: 1.6rem;
            margin-top: 20px;
            font-family: 'Playfair Display', serif;
        }

        /* Small decorative line with a soft shadow */
        .divider {
            width: 70px;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.8);
            margin: 0 auto 30px auto;
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        /* Mobile responsiveness adjustments */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.2rem;
            }
            p.quote {
                font-size: 1.15rem;
            }
            p.message {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="message-container">
            <h1>To My Beautiful Mom</h1>
            <div class="divider"></div>
            <p class="quote">"A mother and daughter share a bond that grows more beautiful with every passing day."</p>
            <p class="message">For every hug, every little lesson, and the endless love you pour into my life—thank you. You are my guiding light, my comfort, and my favorite smile.</p>
            <p class="signature">With all my love,<br>Haadhya</p>
        </div>
    </div>

</body>
</html>
